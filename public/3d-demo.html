<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoSphere 3D Interactive Banner</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #overlay {
            position: absolute;
            color: #ffffff;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #22c55e, #14b8a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 30px rgba(34, 197, 94, 0.4);
        }
        p {
            font-size: 1.5rem;
            color: #a1a1aa;
            margin-top: 1rem;
            letter-spacing: 1px;
        }
    </style>
    <!-- Import Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="overlay">
        <h1>EcoSphere</h1>
        <p>Enterprise ESG Intelligence Platform</p>
    </div>
    <div id="canvas-container"></div>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 15;
        camera.position.y = 5;

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableZoom = false;

        // Globe Particles
        const geometry = new THREE.SphereGeometry(10, 64, 64);
        
        // Convert vertices to particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particleCount = geometry.attributes.position.count;
        const posArray = new Float32Array(particleCount * 3);
        
        for(let i = 0; i < particleCount * 3; i++) {
            posArray[i] = geometry.attributes.position.array[i];
        }
        
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        
        const particlesMaterial = new THREE.PointsMaterial({
            size: 0.05,
            color: 0x22c55e,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });

        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Inner glowing core
        const coreGeometry = new THREE.SphereGeometry(9.8, 32, 32);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x064e3b,
            transparent: true,
            opacity: 0.7,
            wireframe: true
        });
        const coreMesh = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(coreMesh);

        // Connecting lines (Data streams)
        const lineMaterial = new THREE.LineBasicMaterial({
            color: 0x14b8a6,
            transparent: true,
            opacity: 0.15
        });
        
        // Random lines around the globe
        const lineGeo = new THREE.BufferGeometry();
        const linePos = [];
        for(let i=0; i<200; i++) {
            const x = (Math.random() - 0.5) * 25;
            const y = (Math.random() - 0.5) * 25;
            const z = (Math.random() - 0.5) * 25;
            linePos.push(x, y, z);
        }
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
        const lines = new THREE.LineSegments(lineGeo, lineMaterial);
        scene.add(lines);

        // Animation Loop
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Pulse effect
            particlesMaterial.size = 0.05 + Math.sin(elapsedTime * 2) * 0.02;
            
            // Rotate the outer lines slowly
            lines.rotation.y = elapsedTime * 0.05;
            lines.rotation.x = elapsedTime * 0.02;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
